replicaCount: 1

image:
  repository: ghcr.io/ziednov007/devops-coding-challenge
  tag: "2c8e3f8"
  pullPolicy: Always
  pullSecretName: ghcr-pull-secret

service:
  type: ClusterIP
  port: 8080

# Istio Gateway API — HTTPRoute attaches to the shared gateway in istio-system
gateway:
  enabled: true
  name: shared-gateway
  namespace: istio-system
  host: apps.ziednov007.com

mysql:
  deploy: true   # deploys in-cluster MySQL; set false when using an external DB
  host: mysql
  port: 3306
  database: challenge
  username: root

actuator:
  endpoints: health,info

# Workload Identity + Key Vault CSI integration
keyVault:
  enabled: true
  name: "crewmeister-dev-kv"
  tenantId: "604f1a96-cbe8-43f8-abbf-f8eaf5d85730"
  workloadIdentityClientId: "a0a10e9a-6a7f-434f-bd35-0d3455a4ee27"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
