replicaCount: 1

image:
  repository: ghcr.io/ziednov007/devops-coding-challenge
  tag: "d32a2f4"
  pullPolicy: Always
  pullSecretName: ""  # set to a docker-registry secret name if registry is private

service:
  type: ClusterIP
  port: 8080

# Istio Gateway API — HTTPRoute attaches to the shared gateway in istio-system
gateway:
  enabled: true
  name: shared-gateway
  namespace: istio-system
  host: apps.ziednov007.com

mysql:
  deploy: true   # deploys in-cluster MySQL; set false when using an external DB
  host: mysql
  port: 3306
  database: challenge
  username: root

actuator:
  endpoints: health,info

# Workload Identity + Key Vault CSI integration
keyVault:
  enabled: true
  name: "crewmeister-dev-kv"
  tenantId: "604f1a96-cbe8-43f8-abbf-f8eaf5d85730"
  workloadIdentityClientId: ""  # injected at deploy time via Terraform → ArgoCD helm.parameters

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
