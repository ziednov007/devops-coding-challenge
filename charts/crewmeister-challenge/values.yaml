replicaCount: 1

image:
  repository: ghcr.io/zied-boulifi/crewmeister-challenge
  tag: 1c3651e
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

# Istio Gateway API — HTTPRoute attaches to the shared gateway in istio-system
gateway:
  enabled: true
  name: shared-gateway
  namespace: istio-system
  host: apps.ziednov007.com

mysql:
  host: mysql
  port: 3306
  database: challenge
  username: root

actuator:
  endpoints: health,info

# Workload Identity + Key Vault CSI integration
keyVault:
  enabled: false        # set true on AKS
  name: ""              # e.g. crewmeister-kv
  tenantId: ""          # Azure tenant ID
  workloadIdentityClientId: ""  # output: app_identity_client_id

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
