apiVersion: v1
kind: Service
metadata:
  name: {{ include "crewmeister-challenge.fullname" . }}
  labels:
    {{- include "crewmeister-challenge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "crewmeister-challenge.selectorLabels" . | nindent 4 }}
