{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "crewmeister-challenge.fullname" . }}-kv
  labels:
    {{- include "crewmeister-challenge.labels" . | nindent 4 }}
spec:
  provider: azure
  # Sync Key Vault secrets into a native Kubernetes Secret so env vars work
  secretObjects:
    - secretName: {{ include "crewmeister-challenge.fullname" . }}-kv
      type: Opaque
      data:
        - objectName: mysql-password
          key: SPRING_DATASOURCE_PASSWORD
        - objectName: tls-cert
          key: tls.crt
        - objectName: tls-key
          key: tls.key
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.keyVault.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: mysql-password
          objectType: secret
        - |
          objectName: tls-cert
          objectType: secret
        - |
          objectName: tls-key
          objectType: secret
{{- end }}
