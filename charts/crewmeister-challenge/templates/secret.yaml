{{- if not .Values.keyVault.enabled }}
# Used only in local / non-AKS deployments.
# On AKS, the SecretProviderClass syncs credentials from Key Vault.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crewmeister-challenge.fullname" . }}
  labels:
    {{- include "crewmeister-challenge.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.mysql.password | quote }}
{{- end }}
