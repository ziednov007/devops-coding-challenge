apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: base
      targetRevision: "1.23.0"
      helm:
        releaseName: istio-base
    # Gateway API CRDs (standard channel v1.2.1) — vendored to avoid kustomize overlay issues
    - repoURL: https://github.com/ziednov007/devops-coding-challenge
      targetRevision: HEAD
      path: argocd/crds
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
