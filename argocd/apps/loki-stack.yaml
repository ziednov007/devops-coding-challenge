apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: "2.10.2"
    helm:
      releaseName: loki-stack
      values: |
        loki:
          enabled: true
          replicas: 0
          image:
            tag: "2.9.10"   # 2.6.1 (chart default) breaks Grafana 11 health check (no vector() support)
          persistence:
            enabled: true
            size: 10Gi
        promtail:
          enabled: false   # replaced by OpenTelemetry Collector (see otel-collector ArgoCD app)
        grafana:
          enabled: false   # Grafana is managed by kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
