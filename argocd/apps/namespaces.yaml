apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: crewmeister
  labels:
    istio-injection: enabled
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# Shared Istio ingress gateway — ClusterIP only, no external IP
# AGIC fronts it via the Ingress below, keeping 68.210.96.188 as the public entry point
# networking.istio.io/service-type forces ClusterIP without needing the GatewayParameters CRD
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: shared-gateway
      namespace: istio-system
  hostnames:
    - argocd.ziednov007.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - name: shared-gateway
      namespace: istio-system
  hostnames:
    - monitoring.ziednov007.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
# AGIC Ingress — public entry point at 68.210.96.188, routes all hosts to the Istio gateway
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shared-gateway-ingress
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    # Istio gateway returns 404 on port 80 with no Host header; use the dedicated
    # Envoy health port instead so AGIC marks the backend as healthy
    appgw.ingress.kubernetes.io/health-probe-port: "15021"
    appgw.ingress.kubernetes.io/health-probe-path: "/healthz/ready"
spec:
  rules:
    - host: apps.ziednov007.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shared-gateway-istio
                port:
                  number: 80
    - host: argocd.ziednov007.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shared-gateway-istio
                port:
                  number: 80
    - host: monitoring.ziednov007.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shared-gateway-istio
                port:
                  number: 80
