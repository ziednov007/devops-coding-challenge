apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "61.3.0"
    helm:
      releaseName: kube-prometheus-stack
      values: |
        grafana:
          service:
            type: ClusterIP   # accessible only via VPN port-forward
          adminPassword: admin
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki-stack.observability.svc.cluster.local:3100
              access: proxy
            - name: Jaeger
              type: jaeger
              url: http://jaeger-query.observability.svc.cluster.local:16686
              access: proxy
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: istio
                  folder: Istio
                  type: file
                  options:
                    path: /var/lib/grafana/dashboards/istio
          dashboards:
            istio:
              istio-mesh:
                gnetId: 7639
                revision: 1
                datasource: Prometheus
              istio-service:
                gnetId: 7636
                revision: 1
                datasource: Prometheus
        prometheus:
          prometheusSpec:
            additionalScrapeConfigs:
              - job_name: istio-envoy
                metrics_path: /stats/prometheus
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_container_name]
                    action: keep
                    regex: istio-proxy
                  - source_labels: [__address__]
                    action: replace
                    regex: '([^:]+)(?::\d+)?'
                    replacement: '$1:15090'
                    target_label: __address__
                  - action: labelmap
                    regex: __meta_kubernetes_pod_label_(.+)
                  - source_labels: [__meta_kubernetes_namespace]
                    action: replace
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    action: replace
                    target_label: pod
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
